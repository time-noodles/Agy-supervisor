[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agy-supervisor"
version = "0.2.0"
description = "Antigravity CLI Autonomous AI Supervisor & Fast Security Guard"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []
authors = [
    { name = "time-noodles" }
]

[project.urls]
Homepage = "https://github.com/time-noodles/Agy-supervisor"
Repository = "https://github.com/time-noodles/Agy-supervisor.git"

[project.scripts]
agy-sup = "supervisor:main"

[tool.setuptools]
py-modules = [
    "supervisor",
    "pty_adapter",
    "notifier",
    "command_focus",
    "fast_filter",
    "decision_cache",
    "rules",
    "reviewer",
    "context_extractor",
]
